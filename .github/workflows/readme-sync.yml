# 三语 README「每次推送必须同批更新」—— vendored Einfacht 的 readme-sync 闸门的
# CI 落点（判据与 reflect-hooks/pre-push 完全同源：复用闸门本体 check_readme_sync.py）。
#
# 为什么必须有这一面：pre-push 只装在跑过 install.sh 的机器上，且可被
# `git push --no-verify` 跳过 —— 只在自己方便时生效的闸门 = 本仓最擅长的
# 那种「从未跑过的闸门」。CI 正面执行同一条判据，本地先疼、CI 才是承诺的正面。
#
# 诚实边界（不藏）：本 workflow 只验三语同批这一条判据。产物锚定的闸门
# （复跑闸门的 cmd 逐字执行、pin 见证等）锚在「有产物的机器」上 —— 产物树
# （/mnt/hdd/openmodelica-wasm-build）不进 git，CI 上没有；那半边由装了钩子的
# 机器在 pre-commit/pre-push 正面执行（见 gates.yml 里对纯子集的取舍说明）。
name: readme-sync

on:
  push: {}

jobs:
  trio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 判据要 diff 推送前后两个点
      - uses: actions/setup-python@v5
        with:
          # 钉小版本 + check-latest（uTLS-Gone issue #4 的经验）：只写大版本会被
          # runner 旧镜像解析到过期 patch。
          python-version: "3.13"
          check-latest: true
      - name: 三语 README 必须同批更新（名单：REFLECT_READMES）
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "${BEFORE:-$zero}" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$AFTER"
          else
            echo "无可用基线（新分支 / 强推 / tag）⇒ 按全部可见历史判定，不静默放行"
            git log --name-only --pretty=format: "$AFTER"
          fi | sed '/^[[:space:]]*$/d' | sort -u \
            | python3 zreflect/check_readme_sync.py --changed -
